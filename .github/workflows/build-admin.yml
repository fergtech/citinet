name: Build & Push Admin Sidecar Image

# citinet-admin is pulled by every new hub's setup script and by the update
# watchdog, so what's published has to keep up with admin-sidecar/.
on:
  push:
    branches: [master]
    paths:
      - 'admin-sidecar/**'
      - '.github/workflows/build-admin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: admin-sidecar
          file: admin-sidecar/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/fergtech/citinet-admin:latest
            ghcr.io/fergtech/citinet-admin:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
