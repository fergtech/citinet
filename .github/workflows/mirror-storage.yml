name: Copy Storage Image to GHCR

# MinIO's own images were withdrawn, so hubs use SILO, a community fork (AGPL-3.0).
# This keeps our own copy of one reviewed version, byte for byte, so new hubs can still
# install if the original disappears. See docs/storage-image.md.
#
# Run it by hand (Actions tab) -- never on push. To move to a newer version, read its release
# notes, test it against existing data, then change BOTH values below.

on:
  workflow_dispatch:

env:
  VERSION: RELEASE.2026-11-12T00-00-00Z
  DIGEST: sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
  TARGET: ghcr.io/fergtech/citinet-storage

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Copies by digest, so only the reviewed bytes can ever be copied. All processor types come along.
      - name: Copy
        run: docker buildx imagetools create --tag "$TARGET:$VERSION" "docker.io/pgsty/silo@$DIGEST"

      - name: Check the copy is identical
        run: |
          got="sha256:$(docker buildx imagetools inspect --raw "$TARGET:$VERSION" | sha256sum | cut -d' ' -f1)"
          echo "expected $DIGEST"
          echo "copied   $got"
          test "$got" = "$DIGEST"
