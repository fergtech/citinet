# Citinet Hub Stack
# This docker-compose file defines all services needed to run a Citinet hub.
# Prerequisites: Docker 20.10+, Docker Compose 2.0+
# Usage: docker-compose up -d

version: '3.8'

services:
  # Hub API Server
  citinet-api:
    image: ghcr.io/fergtech/citinet-api:latest
    container_name: citinet-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-9090}:9090"
    environment:
      - NODE_ENV=production
      - PORT=9090
      - HUB_NAME=${HUB_NAME}
      - HUB_SLUG=${HUB_SLUG}
      - HUB_LOCATION=${HUB_LOCATION}
      - HUB_DESCRIPTION=${HUB_DESCRIPTION}
      - HUB_VISIBILITY=${HUB_VISIBILITY:-public}
      - DATABASE_URL=postgresql://citinet:${DB_PASSWORD}@citinet-db:5432/citinet
      - STORAGE_URL=http://citinet-storage:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-hub-files}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - TUNNEL_URL=${TUNNEL_URL:-}
      - LIVEKIT_INTERNAL_URL=${LIVEKIT_INTERNAL_URL:-http://citinet-livekit:7880}
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    depends_on:
      citinet-db:
        condition: service_healthy
      citinet-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - citinet-network

  # mDNS/DNS-SD advertiser — lets the mobile app find this hub on the local
  # network with zero typing, instead of only through the online registry's
  # tunnel_url (which always routes over the internet). Separate from
  # citinet-api on purpose: citinet-api sits on the citinet-network bridge,
  # which doesn't forward UDP multicast to the physical LAN, so this needs
  # network_mode: host instead -- isolating it means a host where that isn't
  # available (varies by Docker Desktop version on Windows/Mac) only loses
  # LAN discovery, the main API is completely unaffected. Builds from the
  # local Dockerfile (not the published citinet-api image) so it picks up
  # api/mdnsAdvertise.js immediately -- citinet-api itself is untouched and
  # keeps pulling the stable published image as before.
  citinet-mdns:
    build: .
    container_name: citinet-mdns
    restart: unless-stopped
    command: ["node", "mdnsAdvertise.js"]
    network_mode: host
    environment:
      - PORT=9090
      - HUB_NAME=${HUB_NAME}
      - HUB_SLUG=${HUB_SLUG}

  # PostgreSQL Database
  citinet-db:
    image: postgres:16-alpine
    container_name: citinet-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=citinet
      - POSTGRES_USER=citinet
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citinet -d citinet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - citinet-network

  # MinIO Object Storage (S3-compatible)
  citinet-storage:
    image: minio/minio:latest
    container_name: citinet-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY}
      - MINIO_BROWSER=${MINIO_BROWSER:-on}
    volumes:
      - ${DATA_DIR:-./data}/files:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s
    networks:
      - citinet-network

  # LiveKit — self-hosted WebRTC SFU for Comms (1:1 calls, broadcasts, rooms).
  # The only new service this feature needs; signaling (who's ringing whom)
  # and call history both live inside citinet-api itself (see api/comms.js) —
  # LiveKit's own room list is the live source of truth for "what's live
  # right now," nothing duplicated in Postgres for that.
  #
  # Config is a mounted YAML, not env vars like the rest of this stack —
  # LiveKit's server config isn't settable purely through env vars the way
  # citinet-api's is, so this is the one deliberate exception. Copy
  # livekit.yaml.example to livekit.yaml and set your own key/secret there
  # (matching LIVEKIT_API_KEY/LIVEKIT_API_SECRET below exactly — citinet-api
  # uses those same two values to mint the tokens LiveKit verifies).
  citinet-livekit:
    image: livekit/livekit-server:latest
    container_name: citinet-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      # Media (RTP/RTCP) — kept deliberately small (100 UDP ports) for a
      # single neighborhood hub's realistic concurrency, not LiveKit's own
      # much wider default range meant for larger multi-tenant deployments.
      - "50000-50100:50000-50100/udp"
    networks:
      - citinet-network

networks:
  citinet-network:
    driver: bridge
