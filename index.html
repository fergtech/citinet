
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

      <!-- Primary Meta Tags -->
      <title>Citizens' Internet</title>
      <meta name="title" content="Citizens' Internet" />
      <meta name="description" content="citinet is a decentralized community network platform. Connect with your neighbors, share resources, and build local resilience — on infrastructure your community owns." />
      <meta name="keywords" content="community network, local mesh, neighborhood platform, decentralized, civic tech" />
      <meta name="robots" content="index, follow" />
      <link rel="canonical" href="https://citinet.cloud" />

      <!-- Open Graph / Social -->
      <meta property="og:type" content="website" />
      <meta property="og:url" content="https://citinet.cloud" />
      <meta property="og:title" content="Citizens' Internet" />
      <meta property="og:description" content="A decentralized community network platform. Connect with your neighbors, share resources, and build local resilience — on infrastructure your community owns." />
      <meta property="og:image" content="https://citinet.cloud/icons/og-image.png" />

      <!-- Twitter Card -->
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:url" content="https://citinet.cloud" />
      <meta name="twitter:title" content="Citizens' Internet" />
      <meta name="twitter:description" content="A decentralized community network platform. Connect with your neighbors, share resources, and build local resilience — on infrastructure your community owns." />
      <meta name="twitter:image" content="https://citinet.cloud/icons/og-image.png" />

      <!-- PWA Meta Tags -->
      <!-- fallback used by browsers that ignore media-specific theme-color -->
      <meta name="theme-color" content="#18181b" />
      <!-- theme-color matches the app background per color scheme so the status bar blends seamlessly -->
      <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
      <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="application-name" content="citinet" />

      <!-- Apple iOS Meta Tags -->
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-title" content="citinet" />

      <!-- Icons -->
      <link rel="icon" type="image/png" href="/logo.png" />
      <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

      <!-- Manifest -->
      <link rel="manifest" href="/manifest.json" />

      <!-- Fonts -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap" rel="stylesheet">
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
